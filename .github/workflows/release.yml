# Builds the app and its DMG on GitHub's Macs and publishes them as a Release "v<VERSION>"
# (the tag is created here) each time main changes; pushing the same version again replaces its
# release. The release notes are that version's section of CHANGELOG.md.
name: Release

on:
  push:
    branches: [main, "dev/**"]   # dev/…: build only (checks that it compiles), no release
    paths-ignore: ["**.md", ".gitattributes"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = number of commits

      - name: Version
        id: v
        run: |
          V="$(tr -d ' \n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" || true
          swift --version

      - name: Build app and DMG
        run: |
          set -o pipefail
          if ! bash make-dmg.sh 2>&1 | tee build.log; then
            # The errors as annotations, readable in the run summary
            grep -E "error: |: error:|not found|No such file|fatal error" build.log | sort -u | head -40 | sed 's/^/::error::/'
            echo "::group::build.log tail"; tail -30 build.log | sed 's/^/::error::TAIL: /'; echo "::endgroup::"
            for f in .build/meter/*.err; do [ -s "$f" ] && grep -m3 "error:" "$f" | sed "s|^|::error::$(basename "$f"): |"; done
            exit 1
          fi

      - name: Release notes
        if: github.ref == 'refs/heads/main'
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## " { if (p) exit; if (index($0, "## " v) == 1) { p = 1; next } }
            p { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "HCFR Colorimeter $V for macOS." > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install:** open the DMG and drag **HCFR Colorimeter** onto **Applications**. The app is not
          signed with an Apple Developer ID: the first time, right-click it → **Open** → **Open**
          (or allow it in System Settings → Privacy & Security).
          NOTES

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" "HCFR for macOS $V.dmg" --target "$GITHUB_SHA" \
            --title "HCFR for macOS $V" --notes-file notes.md --latest
