# Builds the app and its DMG on GitHub's Macs and publishes them as a Release.
# Runs when a version tag is pushed (v1.3.1, v1.3.1.1, …): the tag must match the VERSION file.
# The release notes are that version's section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = number of commits

      - name: Version
        id: v
        run: |
          V="$(tr -d ' \n' < VERSION)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ($V)"; exit 1
          fi

      - name: Build app and DMG
        run: bash make-dmg.sh

      - name: Release notes
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## " { if (p) exit; if (index($0, "## " v) == 1) { p = 1; next } }
            p { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "HCFR Colorimeter $V for macOS." > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install:** open the DMG and drag **HCFR Colorimeter** onto **Applications**. The app is not
          signed with an Apple Developer ID: the first time, right-click it → **Open** → **Open**
          (or allow it in System Settings → Privacy & Security).
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release delete "v$V" --yes 2>/dev/null || true
          gh release create "v$V" "HCFR Colorimeter $V.dmg" --title "HCFR Colorimeter $V" --notes-file notes.md --latest
